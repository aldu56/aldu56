<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e2c8b7">
<title>ÉLORIA Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--champagne:#D8C1AE;--ivory:#F5EEE8;--cream:#FAF6F1;--rose:#B99A83;--rose-d:#9C7E68;--cocoa:#49352B;--cocoa-s:#6F584B;--white:#fff;--shadow:0 10px 40px -12px rgb(73 53 43/.18);--lux:0 30px 80px -30px rgb(73 53 43/.35)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--cream);color:var(--cocoa);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
h1,h2,h3,.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;letter-spacing:-.01em;line-height:1.05}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--rose)}
.gold{background:linear-gradient(120deg,#9c7e68,#d8c1ae 40%,#b99a83 60%,#8a6c57);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--cocoa-s)}.small{font-size:13px}.xs{font-size:11px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 24px;border-radius:999px;border:0;cursor:pointer;font-size:14px;font-weight:500;letter-spacing:.02em;transition:.3s;white-space:nowrap;background:var(--cocoa);color:var(--cream);box-shadow:var(--shadow)}
.btn:hover{background:var(--cocoa-s)}
.btn.goldb{background:linear-gradient(90deg,var(--rose-d),var(--rose),var(--champagne));color:#fff}
.btn.out{background:transparent;color:var(--cocoa);border:1px solid rgb(73 53 43/.2);box-shadow:none}
.btn.out:hover{background:#fff;border-color:var(--rose)}
.btn.ghost{background:transparent;color:var(--cocoa);box-shadow:none}
.btn.sm{height:36px;padding:0 16px;font-size:12px}
.btn:disabled{opacity:.5;pointer-events:none}
.card{background:#fff;border:1px solid rgb(216 193 174/.5);border-radius:28px;box-shadow:var(--shadow);padding:26px}
.grid{display:grid;gap:22px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.gside{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));align-items:start}
.pcard{display:grid;grid-template-columns:1fr 1fr}
.bnav{display:none}
.camtools{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.sel-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.sel-cards label{border:1px solid var(--champagne);border-radius:16px;padding:12px 8px;text-align:center;cursor:pointer;font-size:13px;background:#fff;transition:.2s}
.sel-cards input{display:none}
.sel-cards input:checked+span{color:var(--cocoa)}
.sel-cards label:has(input:checked){border-color:var(--rose);background:rgb(216 193 174/.25);box-shadow:var(--shadow)}
.sel-cards.four{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.sel-cards .ic{display:block;font-size:22px;color:var(--rose);margin-bottom:4px}
input,select{width:100%;height:44px;border:1px solid var(--champagne);border-radius:14px;background:#fff;padding:0 14px;font-size:14px}
input:focus,select:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 4px rgb(216 193 174/.4)}
label.l{display:block;font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--cocoa-s);margin-bottom:6px}
.field{margin-bottom:16px}
.alert{border-radius:12px;padding:12px 16px;font-size:13px;margin-bottom:16px}
.alert.err{background:#fff1f2;color:#9f1239}.alert.ok{background:#ecfdf5;color:#065f46}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 12px;font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;background:rgb(216 193 174/.4)}
.badge.warn{background:#fffbeb;color:#92400e}.badge.okb{background:#ecfdf5;color:#065f46}.badge.line{background:transparent;border:1px solid var(--champagne);color:var(--cocoa-s)}
.bar{height:8px;background:var(--ivory);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--champagne),var(--rose));border-radius:99px;transition:width .8s}
/* header */
header.site{position:sticky;top:0;z-index:20;background:rgb(250 246 241/.85);backdrop-filter:blur(12px);border-bottom:1px solid rgb(216 193 174/.4)}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{display:inline-flex;flex-direction:column;align-items:center;line-height:1;cursor:pointer}
.logo b{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:26px;letter-spacing:.32em}
.logo span{font-size:8.5px;letter-spacing:.5em;color:var(--rose);margin-top:4px;font-weight:500}
nav.top a{font-size:13px;margin-left:24px}nav.top a:hover{color:var(--rose-d)}
/* hero */
.hero{padding:60px 0 80px;background:radial-gradient(ellipse at top right,#fff,transparent 55%),radial-gradient(ellipse at bottom left,#EDE3DA,transparent 60%)}
.hero .wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(54px,8vw,96px)}
.float{animation:float 7s ease-in-out infinite}@keyframes float{50%{transform:translateY(-12px)}}
.scanline{position:absolute;left:18%;right:18%;height:2px;background:linear-gradient(90deg,transparent,var(--rose),transparent);box-shadow:0 0 20px var(--rose);animation:scan 2.4s ease-in-out infinite}
@keyframes scan{0%{top:8%;opacity:0}15%,85%{opacity:1}100%{top:90%;opacity:0}}
section.s{padding:80px 0}
.center{text-align:center}.h2{font-size:clamp(38px,5vw,54px)}
.dark{background:var(--cocoa);color:var(--cream)}
.ivory{background:var(--ivory)}
.icon{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--champagne),var(--rose));color:#fff;font-size:20px}
footer{border-top:1px solid rgb(216 193 174/.5);background:var(--ivory);padding:40px 0;margin-top:60px;font-size:12px;color:var(--cocoa-s);text-align:center}
/* dashboard */
.dash{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside.side{background:var(--ivory);padding:30px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
aside.side a.nav{display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:16px;font-size:14px;color:var(--cocoa-s);cursor:pointer;margin-bottom:2px}
aside.side a.nav:hover{background:rgb(255 255 255/.6);color:var(--cocoa)}
aside.side a.nav.on{background:#fff;color:var(--cocoa);box-shadow:var(--shadow)}
aside.side a.nav .lock{margin-left:auto;opacity:.5;font-size:12px}
main.m{padding:40px 44px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:30px}
.ph h1{font-size:clamp(36px,4vw,50px)}
.mobilebar{display:none}
.list>li{list-style:none;display:flex;align-items:center;gap:14px;padding:12px 6px;border-bottom:1px solid var(--ivory)}
.chk{width:28px;height:28px;border-radius:50%;border:1px solid var(--champagne);background:#fff;cursor:pointer;display:grid;place-items:center;flex-shrink:0;color:#fff}
.chk.on{background:var(--rose);border-color:var(--rose)}
.drop{border:2px dashed var(--champagne);border-radius:24px;aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgb(250 246 241/.6);cursor:pointer;text-align:center;padding:20px}
.drop:hover{background:var(--ivory)}
.stage{position:relative;aspect-ratio:4/3;border-radius:24px;overflow:hidden;background:var(--cocoa)}
.stage video,.stage img{width:100%;height:100%;object-fit:cover;display:block}
.guide{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.guide i{border:2px dashed rgb(216 193 174/.85);box-shadow:0 0 0 9999px rgb(73 53 43/.35)}
.tabs{display:inline-flex;background:var(--ivory);border-radius:999px;padding:4px;margin-bottom:18px}
.tabs button{border:0;background:transparent;padding:8px 20px;border-radius:999px;cursor:pointer;font-size:14px;color:var(--cocoa-s)}
.tabs button.on{background:#fff;color:var(--cocoa);box-shadow:var(--shadow)}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--cream);border:1px solid var(--champagne);padding:12px 20px;border-radius:14px;box-shadow:var(--lux);font-size:14px;z-index:99;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translate(-50%,-8px)}}
.reco{border:1px solid rgb(216 193 174/.6);border-radius:18px;padding:18px;margin-bottom:12px}
.notice{background:linear-gradient(90deg,rgb(216 193 174/.4),var(--ivory));border-radius:16px;padding:14px 18px;font-size:14px;margin-bottom:22px}
@media (max-width:1024px){
 .hero .wrap{grid-template-columns:1fr}.hero{padding:36px 0 56px}nav.top{display:none}
 section.s{padding:56px 0}
}
@media (max-width:900px){
 .dash{grid-template-columns:1fr}aside.side{display:none}
 .mobilebar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgb(216 193 174/.4);position:sticky;top:0;background:rgb(250 246 241/.92);backdrop-filter:blur(10px);z-index:30}
 main.m{padding:22px 16px 110px}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgb(255 255 255/.95);backdrop-filter:blur(12px);border-top:1px solid rgb(216 193 174/.5);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--cocoa-s);padding:6px 0;border-radius:12px;position:relative}
 .bnav a b{font-size:19px;font-weight:400;color:var(--rose)}
 .bnav a.on{color:var(--cocoa);background:var(--ivory)}
 .bnav a .lk{position:absolute;top:2px;right:18%;font-size:9px}
}
@media (max-width:640px){
 .pcard{grid-template-columns:1fr}.pcard>div:first-child{aspect-ratio:16/10!important}
 .card{padding:20px;border-radius:22px}
 .ph{margin-bottom:22px}.ph>div:last-child:not(:first-child){width:100%}.ph .btn{flex:1}
 .hero h1{font-size:52px}
 .heroimgs{max-width:380px!important}
 .sel-cards{grid-template-columns:repeat(3,minmax(0,1fr))}
 .sel-cards label{font-size:12.5px;padding:12px 4px}
 .btn{height:46px}
}
@media (max-width:400px){
 .sel-cards{grid-template-columns:1fr 1fr!important}
 .sel-cards:not(.four) label:nth-child(3){grid-column:span 2}
}

/* ============ SATIN GLASS THEME ============ */
:root{
 --satin:#d9bfad;--satin-l:#ecd9cb;--satin-d:#c3a28d;
 --cocoa:#3f3029;--cocoa-s:#52403a;--choc:#4a382e;--choc-l:#6e5546;
 --champagne:#e6d2c3;--ivory:rgb(255 255 255/.38);--cream:#f3e6dc;--rose:#644c3f;--rose-d:#5e483c;
 --glass:rgb(255 247 241/.42);--glass-strong:rgb(255 248 243/.62);--glass-b:rgb(255 255 255/.62);
 --shadow:0 18px 40px -22px rgb(63 48 41/.45),inset 0 1px 0 rgb(255 255 255/.7);
 --lux:0 40px 80px -30px rgb(63 48 41/.55);
}
html{background:#cdb09c}
body{color:var(--cocoa);background:
 radial-gradient(120% 70% at 85% -10%,rgb(255 245 236/.95),transparent 55%),
 radial-gradient(90% 60% at -10% 40%,rgb(255 240 228/.7),transparent 60%),
 radial-gradient(80% 60% at 110% 90%,rgb(196 160 138/.55),transparent 60%),
 linear-gradient(160deg,#ecd8ca 0%,#dcc0ae 45%,#cfb09c 100%);background-attachment:fixed;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.75;background-size:cover;background-position:center;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 900' preserveAspectRatio='none'><defs><linearGradient id='a' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='%23fff' stop-opacity='0'/><stop offset='.5' stop-color='%23fff' stop-opacity='.85'/><stop offset='1' stop-color='%23fff' stop-opacity='0'/></linearGradient><filter id='b'><feGaussianBlur stdDeviation='6'/></filter></defs><g fill='none' stroke='url(%23a)' stroke-linecap='round'><path d='M-50 210 C 250 60, 520 360, 820 190 S 1150 40, 1260 120' stroke-width='3' filter='url(%23b)'/><path d='M-50 210 C 250 60, 520 360, 820 190 S 1150 40, 1260 120' stroke-width='1'/><path d='M-60 640 C 200 520, 480 760, 760 610 S 1100 470, 1270 560' stroke-width='4' filter='url(%23b)'/><path d='M-60 640 C 200 520, 480 760, 760 610 S 1100 470, 1270 560' stroke-width='1.2'/><path d='M300 920 C 520 760, 820 860, 1260 700' stroke-width='2.5' filter='url(%23b)' opacity='.7'/></g></svg>")}
#app{position:relative;z-index:1}
h1,h2,h3,.serif{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;color:var(--cocoa)}
h1{font-weight:600}
.eyebrow{color:#56423a;letter-spacing:.26em}
.muted{color:var(--cocoa-s)}
.gold{background:none;-webkit-background-clip:initial;background-clip:initial;color:var(--choc-l)}
/* glass surfaces */
.card{background:var(--glass);border:1px solid var(--glass-b);border-radius:26px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%)}
.reco{background:rgb(255 250 246/.35);border:1px solid var(--glass-b);border-radius:20px;box-shadow:inset 0 1px 0 rgb(255 255 255/.6)}
.notice{background:var(--glass-strong);border:1px solid var(--glass-b);border-radius:999px;backdrop-filter:blur(14px);text-align:center;box-shadow:var(--shadow)}
.ivory{background:transparent}
section.s.ivory{background:linear-gradient(180deg,transparent,rgb(255 245 238/.35),transparent)}
/* buttons */
.btn{border-radius:999px;font-weight:500;letter-spacing:.01em}
.btn,.btn.goldb{color:#f6ebe2;border:1px solid rgb(255 255 255/.25);
 background:radial-gradient(120% 140% at 30% 0%,#7a604f 0%,#4a382e 45%,#33261f 100%);
 box-shadow:0 10px 24px -10px rgb(51 38 31/.7),inset 0 1px 0 rgb(255 255 255/.25),0 0 0 3px rgb(255 255 255/.28)}
.btn:hover,.btn.goldb:hover{filter:brightness(1.08);background:radial-gradient(120% 140% at 30% 0%,#836856 0%,#523e33 45%,#3a2b23 100%)}
.btn.out{background:var(--glass-strong);color:var(--cocoa);border:1px solid var(--glass-b);box-shadow:var(--shadow);backdrop-filter:blur(12px)}
.btn.out:hover{background:rgb(255 250 246/.8);border-color:#fff}
.btn.ghost{background:transparent;color:var(--cocoa);border:0;box-shadow:none}
.btn.ghost:hover{background:var(--glass)}
/* inputs */
input,select{background:rgb(255 250 246/.55);border:1px solid var(--glass-b);border-radius:16px;box-shadow:inset 0 1px 2px rgb(63 48 41/.08);backdrop-filter:blur(8px)}
input:focus,select:focus{border-color:#fff;box-shadow:0 0 0 4px rgb(255 255 255/.45)}
label.l{color:var(--cocoa-s)}
.sel-cards label{background:var(--glass);border:1px solid var(--glass-b);border-radius:18px;box-shadow:inset 0 1px 0 rgb(255 255 255/.6)}
.sel-cards label:has(input:checked){background:var(--glass-strong);border-color:#fff;box-shadow:var(--shadow),0 0 0 2px var(--choc)}
.sel-cards .ic{color:var(--choc)}
/* badges, bars, misc */
.badge{background:rgb(255 250 246/.55);border:1px solid var(--glass-b);color:var(--cocoa)}
.badge.line{background:transparent;border-color:rgb(107 87 75/.35)}
.bar{height:6px;background:rgb(255 255 255/.55);box-shadow:inset 0 1px 2px rgb(63 48 41/.12)}
.bar>i{background:linear-gradient(90deg,#3f3029,#6e5546)}
.icon{background:var(--glass-strong);border:1px solid var(--glass-b);color:var(--choc);box-shadow:var(--shadow)}
.chk{background:rgb(255 255 255/.55);border-color:var(--glass-b)}
.chk.on{background:radial-gradient(120% 140% at 30% 0%,#7a604f,#3f3029);border-color:#fff}
.alert.err{background:rgb(255 236 236/.7);border:1px solid rgb(255 255 255/.6)}
.alert.ok{background:rgb(236 250 243/.7);border:1px solid rgb(255 255 255/.6)}
.tabs{background:rgb(255 255 255/.3);border:1px solid var(--glass-b);backdrop-filter:blur(10px)}
.tabs button.on{background:var(--glass-strong);box-shadow:var(--shadow);color:var(--cocoa)}
.drop{background:rgb(255 250 246/.3);border-color:rgb(255 255 255/.75)}
.drop:hover{background:rgb(255 250 246/.5)}
.stage{background:linear-gradient(160deg,#5a463a,#2f241e);border:1px solid var(--glass-b)}
.list>li{border-bottom:1px solid rgb(255 255 255/.5)}
.toast{background:var(--glass-strong);border:1px solid #fff;backdrop-filter:blur(16px)}
/* header / footer / hero */
header.site{background:rgb(240 224 212/.5);border-bottom:1px solid rgb(255 255 255/.55);backdrop-filter:blur(16px)}
.logo b{font-family:"Cormorant Garamond",Georgia,serif;font-style:normal;font-weight:500;color:var(--cocoa)}
.logo span{color:var(--rose)}
.logo::before{content:"✦";font-size:11px;color:var(--rose);margin-bottom:3px}
.hero{background:transparent}
.hero h1 em{font-weight:500}
.scanline{background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 20px #fff}
.dark{background:radial-gradient(120% 120% at 20% 0%,#5a463a,#2f241e 70%);color:#f3e6dc}
.dark h2,.dark .serif{color:#f3e6dc}
footer{background:rgb(255 245 238/.3);border-top:1px solid rgb(255 255 255/.55);backdrop-filter:blur(10px)}
/* product art frames */
.pcard>div:first-child,.heroimgs>div{background:linear-gradient(160deg,#f0e0d4,#d6b9a6)}
/* dashboard */
aside.side{background:rgb(250 238 230/.45);border-right:1px solid rgb(255 255 255/.55);backdrop-filter:blur(20px)}
aside.side a.nav{color:var(--cocoa-s)}
aside.side a.nav span{color:var(--choc)!important}
aside.side a.nav:hover{background:rgb(255 255 255/.35)}
aside.side a.nav.on{background:var(--glass-strong);color:var(--cocoa);box-shadow:var(--shadow);border:1px solid var(--glass-b)}
aside.side>div:nth-of-type(1){background:var(--glass)!important;border:1px solid var(--glass-b)}
@media (max-width:900px){
 .mobilebar{background:rgb(240 224 212/.55)!important;border-bottom:1px solid rgb(255 255 255/.55)!important;backdrop-filter:blur(16px)}
 .bnav{left:12px;right:12px;bottom:10px;border-radius:26px;background:rgb(250 238 230/.6)!important;border:1px solid var(--glass-b)!important;box-shadow:var(--lux),inset 0 1px 0 rgb(255 255 255/.7);backdrop-filter:blur(22px) saturate(140%);padding:6px 4px!important;margin-bottom:env(safe-area-inset-bottom)}
 .bnav a{color:var(--cocoa-s)}
 .bnav a b{color:var(--cocoa-s)}
 .bnav a.on{background:transparent;color:var(--cocoa);font-weight:600}
 .bnav a.on b{color:var(--cocoa)}
 .bnav a.on::after{content:"";position:absolute;bottom:2px;left:30%;right:30%;height:2px;border-radius:2px;background:var(--cocoa)}
 main.m{padding-bottom:120px}
}

/* text on dark surfaces (streak card, dark section, camera stage) */
.on-dark,.on-dark h1,.on-dark h2,.on-dark h3,.on-dark .serif,.on-dark .muted,.on-dark p{color:#f6ebe2}
.on-dark .muted,.on-dark .xs,.on-dark .small{color:rgb(246 235 226/.78)}
.on-dark .eyebrow,.on-dark [style*="--champagne"]{color:#e8cfbd!important}
.on-dark .btn.out{color:#f6ebe2!important;background:rgb(255 255 255/.12);border-color:rgb(255 255 255/.45)}
</style>

<div style="font-size:30px;letter-spacing:.3em">ÉLORIA</div><p style="font-size:20px;font-style:italic;margin:18px 0 10px">Esta vista previa no puede ejecutar la app.</p>
<p style="font-family:system-ui,sans-serif;font-size:15px">En iPhone o iPad, la vista previa de la app Archivos no ejecuta JavaScript. Abre el enlace web de la demo en Safari, o abre este archivo con Chrome o Safari en un ordenador.</p></div></noscript>
<div id="app"></div>
<script>
/* ============================================================
   ÉLORIA SKIN • HAIR — standalone demo (single HTML file).
   Data is stored only in this browser (localStorage).
   The analysis engine is the same one used by the full app.
   ============================================================ */
const KEY = "eloria-demo-v1";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (n, a = 0, b = 100) => Math.min(b, Math.max(a, n));
const lvl = (n) => Math.round(clamp(n));

const owns = (u, type) => u.devices.some((d) => d.type === type);
const DEV_NAME = { mirror: "GlowMirrorPro", comb: "GlowBrushPro" };
/** Pairs the next free demo serial of each requested type. Returns a message. */
function pairTypes(u, email, types, nickname = "") {
  const done = [], skipped = [];
  for (const type of types) {
    if (owns(u, type)) { skipped.push(DEV_NAME[type]); continue; }
    const prefix = type === "mirror" ? "ELM" : "ELC";
    let serial = null;
    for (let i = 1; i <= 50 && !serial; i++) { const s = `${prefix}-DEMO-${String(i).padStart(4, "0")}`; if (!db.claimed[s]) serial = s; }
    if (!serial) { skipped.push(DEV_NAME[type]); continue; }
    db.claimed[serial] = email;
    u.devices.push({ serial, type, nickname: (types.length === 1 && nickname) || (type === "mirror" ? "Mi GlowMirrorPro" : "Mi GlowBrushPro"), paired: new Date().toISOString() });
    done.push(`${DEV_NAME[type]} (${serial})`);
  }
  return { done, skipped };
}

function ring(score, size = 150) {
  const st = size * 0.07, r = (size - st) / 2, c = 2 * Math.PI * r, off = c - (score / 100) * c;
  return `<div style="position:relative;width:${size}px;height:${size}px;display:inline-grid;place-items:center">
  <svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><defs><linearGradient id="rg${size}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a604f"/><stop offset="1" stop-color="#33261f"/></linearGradient></defs>
  <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="rgb(255 255 255 / .55)" stroke-width="${st}"/>
  <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="url(#rg${size})" stroke-width="${st}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>
  <div style="position:absolute;text-align:center"><div class="serif" style="font-size:${size * 0.3}px;line-height:1">${score}</div><div class="xs muted" style="letter-spacing:.2em;text-transform:uppercase;margin-top:4px">${scoreLabel(score)}</div></div></div>`;
}
function lineChart(points) {
  if (points.length < 2) return `<div class="center muted small" style="border:1px dashed var(--champagne);border-radius:18px;padding:60px 20px">Tu curva de progreso aparecerá tras tu segundo análisis.</div>`;
  const W = 640, H = 220, p = 30, xs = (i) => p + (i * (W - 2 * p)) / (points.length - 1), ys = (v) => H - p - (v / 100) * (H - 2 * p);
  const d = points.map((pt, i) => `${i ? "L" : "M"}${xs(i)},${ys(pt.v)}`).join("");
  const area = `${d}L${xs(points.length - 1)},${H - p}L${xs(0)},${H - p}Z`;
  const grid = [0, 25, 50, 75, 100].map((g) => `<line x1="${p}" x2="${W - p}" y1="${ys(g)}" y2="${ys(g)}" stroke="rgb(255 255 255 / .55)"/><text x="4" y="${ys(g) + 4}" font-size="10" fill="#6F584B">${g}</text>`).join("");
  const dots = points.map((pt, i) => `<circle cx="${xs(i)}" cy="${ys(pt.v)}" r="4" fill="#3f3029" stroke="#fff" stroke-width="1.5"><title>${pt.l}: ${pt.v}</title></circle>`).join("");
  const labels = points.map((pt, i) => (i === 0 || i === points.length - 1 || points.length <= 6 ? `<text x="${xs(i)}" y="${H - 8}" font-size="10" fill="#6F584B" text-anchor="middle">${pt.l}</text>` : "")).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a382e" stop-opacity=".28"/><stop offset="1" stop-color="#4a382e" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#ar)"/><path d="${d}" fill="none" stroke="#3f3029" stroke-width="2.2"/>${dots}${labels}</svg>`;
}
function radar(kind, h, prev) {
  const keys = Object.keys(LABELS[kind]), N = keys.length, S = 320, c = S / 2, R = 105;
  const pt = (i, v) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / N; return [c + Math.cos(a) * R * v / 100, c + Math.sin(a) * R * v / 100]; };
  const poly = (vals) => vals.map((v, i) => pt(i, v).join(",")).join(" ");

  const labels = keys.map((k, i) => { const [x, y] = pt(i, 128); return `<text x="${x}" y="${y}" font-size="10.5" fill="#6F584B" text-anchor="middle" dominant-baseline="middle">${LABELS[kind][k]}</text>`; }).join("");
  return `<svg viewBox="-30 0 380 ${S}" style="width:100%;max-width:420px;display:block;margin:auto">${rings}
  ${prev ? `<polygon points="${poly(keys.map((k) => prev[k]))}" fill="#fff" fill-opacity=".25" stroke="#fff" stroke-dasharray="4 4"/>` : ""}
  <polygon points="${poly(keys.map((k) => h[k]))}" fill="#4a382e" fill-opacity=".22" stroke="#3f3029" stroke-width="2"/>${labels}</svg>`;
}
function bars(kind, h, prev) {

  `<div class="grid g2"><div class="card" style="padding:0;overflow:hidden">${a.image ? `<img src="${a.image}" alt="" style="width:100%;aspect-ratio:4/3;object-fit:cover;display:block">` : ""}<div style="padding:24px;display:flex;gap:22px;align-items:center;flex-wrap:wrap">${ring(a.score, 130)}<div><p class="serif" style="font-size:26px">${scoreLabel(a.score)}</p>${d !== null ? `<p class="small" style="color:${d >= 0 ? "#035c42" : "#9f1239"}">${d >= 0 ? "+" : ""}${d} vs. escaneo anterior</p>` : ""}<span class="badge" style="margin-top:6px">${esc(a.type)}</span> <span class="badge line">Motor de visión</span></div></div></div>
  <div class="card"><h3 style="font-size:28px">Lo que vemos</h3><p class="serif" style="font-size:21px;margin:12px 0">${esc(a.summary)}</p><ul style="padding-left:18px" class="small muted">${a.observations.map((o) => `<li style="margin-bottom:6px">${esc(o)}</li>`).join("")}</ul>${radar(kind, h, ph2)}</div></div>
  <div class="grid g2" style="margin-top:22px"><div class="card"><h3 style="font-size:28px">Métricas</h3><p class="xs muted" style="margin-bottom:16px">Puntuaciones de salud sobre 100: cuanto más alto, mejor.</p>${bars(kind, h, ph2)}</div>
  <div class="card"><h3 style="font-size:28px;margin-bottom:16px">Tus recomendaciones</h3>${a.recos.map((r) => `<div class="reco"><span class="badge ${r.priority === 1 ? "warn" : r.priority === 3 ? "line" : ""}">${r.priority === 1 ? "Prioridad" : esc(r.category)}</span><p class="serif" style="font-size:21px;margin-top:10px">${esc(r.title)}</p><p class="small muted" style="margin-top:4px">${esc(r.body)}</p>${r.product ? `<p class="small" style="margin-top:10px;background:rgb(245 238 232/.7);padding:10px 14px;border-radius:12px">${esc(r.product)}</p>` : ""}</div>`).join("")}</div></div>`);
}
function vRoutine() {
  const u = me(), t = today(), doneToday = u.done[t] || [];
  if (!u.routine.length) return shell("routine", ph("Ritual diario", "Mi ritual") + `<div class="card center" style="padding:50px"><p class="serif" style="font-size:26px">Todavía no tienes ritual</p><p class="small muted">Haz un análisis y ÉLORIA compondrá tu ritual personalizado.</p></div>`);
  const groups = [["morning", "☀ Mañana"], ["evening", "☾ Noche"], ["weekly", "▦ Esta semana"]];
  let streak = 0; const daily = u.routine.filter((s) => s.time !== "weekly");
  for (let i = 0; i < 60; i++) { const d = new Date(); d.setDate(d.getDate() - i); const ds = new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); const c = daily.filter((s) => u.done[ds]?.includes(s.id)).length; if (daily.length && c / daily.length >= 0.5) streak++; else if (i > 0) break; }
  return shell("routine", ph("Ritual diario", "Mi ritual", "Compuesto a partir de tus últimos análisis. Se actualiza cada vez que escaneas.") + `<div class="grid gside"><div>
  ${groups.map(([g, l]) => { const s = u.routine.filter((x) => x.time === g); return s.length ? `<div class="card" style="margin-bottom:18px"><h2 style="font-size:28px">${l}</h2><ul class="list" style="margin-top:8px">${s.map((x) => { const on = doneToday.includes(x.id); return `<li><button class="chk ${on ? "on" : ""}" onclick="toggleStep('${x.id}')" aria-label="Marcar ${esc(x.title)}">${on ? "✓" : ""}</button><span style="flex:1"><span class="small" style="${on ? "text-decoration:line-through;color:var(--cocoa-s)" : ""}">${esc(x.title)}</span><br><span class="xs muted">${esc(x.desc)}</span></span><span class="badge line">${x.kind === "skin" ? "piel" : "capilar"}</span></li>`; }).join("")}</ul></div>` : ""; }).join("")}</div>
  <div class="card on-dark" style="background:radial-gradient(120% 140% at 20% 0%,#5a463a,#2f241e 75%);border:1px solid rgb(255 255 255/.35)"><p class="xs" style="letter-spacing:.2em;text-transform:uppercase;color:var(--champagne)">Racha</p><p class="serif" style="font-size:64px">${streak} <span style="font-size:22px;opacity:.7">día${streak === 1 ? "" : "s"}</span></p><p class="xs" style="opacity:.6">Días con al menos la mitad de tu ritual completado.</p></div></div>`);
}

/* ---------------- actions ---------------- */
function logout() { db.session = null; save(); stopCam(); location.hash = "#/"; }
function unpair(serial) { if (!confirm("¿Quitar este dispositivo? Tu historial se conserva.")) return; const u = me(); u.devices = u.devices.filter((d) => d.serial !== serial); delete db.claimed[serial]; save(); toast("Dispositivo quitado"); render(); }
function delAnalysis(kind, id) { if (!confirm("¿Eliminar este análisis de forma permanente?")) return; const u = me(); u[kind] = u[kind].filter((a) => a.id !== id); save(); toast("Análisis eliminado"); location.hash = `#/${kind}`; }
function toggleStep(id) { const u = me(), t = today(); u.done[t] = u.done[t] || []; u.done[t] = u.done[t].includes(id) ? u.done[t].filter((x) => x !== id) : [...u.done[t], id]; save(); render(); }
const curKind = () => (location.hash.split("/")[2] === "scalp" ? "scalp" : "skin");
function isMobile() {
  const ua = navigator.userAgent || "";
  const iPadOS = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
  return /Android|iPhone|iPad|iPod|Mobile|Tablet|Silk|Kindle/i.test(ua) || iPadOS || (matchMedia("(pointer: coarse)").matches && innerWidth < 1100);
}
let facing = null;
function scanTab(t) {
  $("#tUp").classList.toggle("on", t === "up"); $("#tCam").classList.toggle("on", t === "cam"); $("#pUp").hidden = t !== "up"; $("#pCam").hidden = t !== "cam";
  if (t !== "cam") stopCam();
  else if (isMobile()) $("#camIn").click(); // runs inside the tap, so the browser allows it
}
function camMessage(text, showNative = true) {
  $("#camIdle").hidden = false; $("#vid").hidden = true; $("#guide").hidden = true; $("#camLive").hidden = true;
  $("#camerr").textContent = text;
  if (showNative) $("#nativeCam").hidden = false;
}
async function startCam() {
  if (isMobile()) return $("#camIn").click();
  const kind = curKind();
  facing = facing || (kind === "skin" ? "user" : "environment");
  const canLive = window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
  if (!canLive) {
    // e.g. file opened from the phone's downloads: use the native camera app instead
    if (isMobile()) { $("#camIn").click(); return camMessage("Tu navegador no permite la cámara en directo aquí, así que hemos abierto la cámara del sistema.", true); }
    return camMessage("Este navegador no permite usar la cámara en este archivo. Ábrelo con Chrome, Edge o Safari, o usa “Subir foto”.", false);
  }
  $("#camerr").textContent = "Solicitando permiso… acepta el aviso del navegador.";
  try {
    stopCam();
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
    const v = $("#vid");
    if (!v) return stopCam();
    v.srcObject = stream; v.style.transform = facing === "user" ? "scaleX(-1)" : "none";
    v.hidden = false; await v.play().catch(() => {});
    $("#camIdle").hidden = true; $("#guide").hidden = false; $("#camLive").hidden = false;
  } catch (e) {
    const n = e && e.name;
    const msg = n === "NotAllowedError" || n === "SecurityError" ? "Has bloqueado el permiso de cámara. Actívalo en los ajustes del navegador (icono del candado o de la cámara en la barra de direcciones) y vuelve a pulsar “Activar cámara”."
      : n === "NotFoundError" || n === "OverconstrainedError" ? "No hemos encontrado ninguna cámara en este dispositivo."
      : n === "NotReadableError" ? "La cámara está siendo usada por otra aplicación. Ciérrala y vuelve a intentarlo."
      : "No hemos podido abrir la cámara.";
    camMessage(msg + (isMobile() ? " También puedes usar la cámara del sistema." : ""), isMobile());
  }
}
function flipCam() { facing = facing === "user" ? "environment" : "user"; startCam(); }
function capture() {
  const v = $("#vid"); if (!v || !v.videoWidth) return;
  const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight; const x = c.getContext("2d");
  if (facing === "user") { x.translate(c.width, 0); x.scale(-1, 1); }
  x.drawImage(v, 0, 0); stopCam(); analyze(curKind(), c.toDataURL("image/jpeg", 0.92));
}
function analyze(kind, src) {
  const box = $("#scanbox");
  box.innerHTML = `<div class="center" style="padding:20px"><div style="position:relative;width:220px;aspect-ratio:1;margin:auto;border-radius:50%;overflow:hidden;border:4px solid var(--champagne)"><img src="${src}" style="width:100%;height:100%;object-fit:cover;opacity:.8"><div class="scanline" style="left:0;right:0"></div></div><p class="serif" id="stg" style="font-size:24px;margin-top:24px">✦ Calibrando la luz…</p><div class="bar" style="margin-top:16px"><i id="pg" style="width:15%"></i></div></div>`;
  const stages = ["Calibrando la luz", "Mapeando la textura", "Midiendo tono y equilibrio", "Componiendo tu ritual"];
  stages.forEach((s, i) => setTimeout(() => { const e = $("#stg"), p = $("#pg"); if (e) e.textContent = `✦ ${s}…`; if (p) p.style.width = `${(i + 1) * 25}%`; }, i * 600));
  const img = new Image();
  img.onload = () => setTimeout(() => {
    // features on a 192×192 centre crop (same as the server pipeline)
    const S = 192, c = document.createElement("canvas"); c.width = S; c.height = S; const x = c.getContext("2d", { willReadFrequently: true });
    const sc = Math.max(S / img.width, S / img.height), w = img.width * sc, h = img.height * sc; x.drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
    const f = extractFeatures(x.getImageData(0, 0, S, S).data, S, S);
    const issue = checkQuality(f, kind);
    if (issue) return render(issue);
    // keep a small copy of the photo
    const T = 640, ts = Math.min(1, T / Math.max(img.width, img.height)), t = document.createElement("canvas"); t.width = img.width * ts; t.height = img.height * ts; t.getContext("2d").drawImage(img, 0, 0, t.width, t.height);
    const metrics = kind === "skin" ? skinMetrics(f) : scalpMetrics(f), score = overall(kind, metrics), type = kind === "skin" ? skinType(metrics) : scalpType(metrics), { summary, observations } = describe(kind, metrics, type, score);
    const u = me(), a = { id: uid(), date: new Date().toISOString(), metrics, score, type, summary, observations, recos: recommendations(kind, metrics), image: t.toDataURL("image/jpeg", 0.75) };
    u[kind].push(a); u.routine = [...u.routine.filter((s) => s.kind !== kind), ...routine(kind, metrics)];
    save(); location.hash = `#/report/${kind}/${a.id}/new`;
  }, 2400);
  img.onerror = () => render("Este archivo no se puede leer como imagen.");
  img.src = src;
}

/* ---------------- demo account with history (for presentations) ---------------- */
function quickDemo() {
  const email = "demo@eloria.app";
  if (!db.users[email]) {
    const u = { name: "Lucía Demo", pass: hash("demo1234"), devices: [], skin: [], scalp: [], routine: [], done: {} };
    db.users[email] = u;
    pairTypes(u, email, ["mirror", "comb"]);
    // six weekly scans showing a realistic improvement
    const base = { skin: { hydration: 42, oiliness: 70, pores: 62, wrinkles: 40, redness: 52, pigmentation: 55, elasticity: 58 }, scalp: { hydration: 44, oiliness: 72, flaking: 58, sensitivity: 48, density: 55, follicle_health: 50 } };
    const better = { skin: { hydration: 6, oiliness: -5, pores: -4, wrinkles: -1, redness: -5, pigmentation: -3, elasticity: 2 }, scalp: { hydration: 5, oiliness: -6, flaking: -7, sensitivity: -5, density: 1, follicle_health: 5 } };
    for (const kind of ["skin", "scalp"]) for (let w = 5; w >= 0; w--) {
      const step = 5 - w, m = {};
      for (const k in base[kind]) m[k] = lvl(base[kind][k] + better[kind][k] * step + ((step * 7 + k.length) % 5) - 2);
      const score = overall(kind, m), type = kind === "skin" ? skinType(m) : scalpType(m), d = describe(kind, m, type, score);
      u[kind].push({ id: uid(), date: new Date(Date.now() - w * 7 * 864e5).toISOString(), metrics: m, score, type, summary: d.summary, observations: d.observations, recos: recommendations(kind, m), image: null });
    }
    u.routine = [...routine("skin", u.skin[5].metrics), ...routine("scalp", u.scalp[5].metrics)];
    for (let i = 1; i <= 4; i++) { const dd = new Date(Date.now() - i * 864e5); u.done[new Date(dd - dd.getTimezoneOffset() * 6e4).toISOString().slice(0, 10)] = u.routine.filter((s) => s.time !== "weekly").map((s) => s.id); }
  }
  db.session = email; save(); location.hash = "#/dashboard";
}

/* ---------------- router ---------------- */
function bind() {
  const af = $("#authf");
  if (af) af.onsubmit = (e) => {
    e.preventDefault();
    const su = location.hash.startsWith("#/signup"), email = $("#e").value.trim().toLowerCase(), pass = $("#p").value;
    if (su) {
      const name = $("#n").value.trim();
      if (name.length < 2) return go(vAuth("signup", "Introduce tu nombre."));
      if (!/[A-Za-z]/.test(pass) || !/\d/.test(pass)) return go(vAuth("signup", "La contraseña debe tener letras y números (mínimo 8)."));
      if (db.users[email]) return go(vAuth("signup", "Ya existe una cuenta con este email."));
      const u = (db.users[email] = { name, pass: hash(pass), devices: [], skin: [], scalp: [], routine: [], done: {} });
      const choice = document.querySelector('input[name="dev"]:checked')?.value || "none";
      const r = pairTypes(u, email, typesOf(choice));
      db.session = email; save();
      location.hash = r.done.length ? "#/dashboard" : "#/devices";
      if (r.done.length) toast(`Emparejado: ${r.done.join(" y ")}`);
    } else {
      const u = db.users[email];
      if (!u || u.pass !== hash(pass)) return go(vAuth("login", "Email o contraseña incorrectos."));
      db.session = email; save(); location.hash = "#/dashboard";
    }
  };
  const pf = $("#pairf");
  if (pf) {
    pf.onsubmit = (e) => {
      e.preventDefault();
      const u = me(), choice = document.querySelector('input[name="pdev"]:checked').value;
      const r = pairTypes(u, db.session, typesOf(choice), $("#nn").value.trim());
      save();
      if (!r.done.length) return go(vDevices({ ok: false, text: `Ya tienes emparejado: ${r.skipped.join(" y ")}.` }));
      go(vDevices({ ok: true, text: `Emparejado: ${r.done.join(" y ")}.${r.skipped.length ? ` (${r.skipped.join(" y ")} ya estaba emparejado.)` : ""} ¡Ya puedes hacer tu primer escaneo!` }));
    };
  }
  const file = $("#file"), drop = $("#drop"), camIn = $("#camIn");
  if (file) {
    const kind = curKind();
    const handle = (f) => {
      if (!f) return;
      if (!/^image\/(jpeg|png|webp)$/.test(f.type)) return render("Elige una imagen JPEG, PNG o WebP.");
      if (f.size > 8 * 1024 * 1024) return render("Las imágenes deben pesar 8 MB o menos.");
      const r = new FileReader(); r.onload = () => analyze(kind, r.result); r.readAsDataURL(f);
    };
    file.onchange = () => handle(file.files[0]);
    camIn.onchange = () => handle(camIn.files[0]);
    drop.ondragover = (e) => e.preventDefault();
    drop.ondrop = (e) => { e.preventDefault(); handle(e.dataTransfer.files[0]); };
  }
}
function hash(s) { let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return "h" + (h >>> 0).toString(36); }
function go(html) { $("#app").innerHTML = html; bind(); }
function render(err) {
  stopCam(); facing = null;
  const parts = location.hash.replace(/^#\/?/, "").split("/"), [r, a, b, c] = parts;
  const anchor = location.hash.split("#")[2];
  const priv = ["dashboard", "devices", "skin", "scalp", "scan", "report", "routine"];
  if (priv.includes(r) && !me()) { location.hash = "#/login"; return; }
  if (["login", "signup"].includes(r) && me()) { location.hash = "#/dashboard"; return; }
  let html;
  switch (r) {
    case "login": html = vAuth("login"); break;
    case "signup": html = vAuth("signup"); break;
    case "dashboard": html = vDashboard(); break;
    case "devices": html = vDevices(); break;
    case "skin": case "scalp": html = vKind(r); break;
    case "scan": html = vScan(a === "scalp" ? "scalp" : "skin", typeof err === "string" ? err : ""); break;
    case "report": html = vReport(a === "scalp" ? "scalp" : "skin", b, c === "new"); break;
    case "routine": html = vRoutine(); break;
    default: html = vHome();
  }
  if (html) go(html);
  if (anchor) document.getElementById(anchor)?.scrollIntoView({ behavior: "smooth" }); else window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => render());
render();
