<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ÉLORIA Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--champagne:#D8C1AE;--ivory:#F5EEE8;--cream:#FAF6F1;--rose:#B99A83;--rose-d:#9C7E68;--cocoa:#49352B;--cocoa-s:#6F584B;--white:#fff;--shadow:0 10px 40px -12px rgb(73 53 43/.18);--lux:0 30px 80px -30px rgb(73 53 43/.35)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--cocoa);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
h1,h2,h3,.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;letter-spacing:-.01em;line-height:1.05}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--rose)}
.gold{background:linear-gradient(120deg,#9c7e68,#d8c1ae 40%,#b99a83 60%,#8a6c57);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--cocoa-s)}.small{font-size:13px}.xs{font-size:11px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 24px;border-radius:999px;border:0;cursor:pointer;font-size:14px;font-weight:500;letter-spacing:.02em;transition:.3s;background:var(--cocoa);color:var(--cream);box-shadow:var(--shadow)}
.btn:hover{background:var(--cocoa-s)}
.btn.goldb{background:linear-gradient(90deg,var(--rose-d),var(--rose),var(--champagne));color:#fff}
.btn.out{background:transparent;color:var(--cocoa);border:1px solid rgb(73 53 43/.2);box-shadow:none}
.btn.out:hover{background:#fff;border-color:var(--rose)}
.btn.ghost{background:transparent;color:var(--cocoa);box-shadow:none}
.btn.sm{height:36px;padding:0 16px;font-size:12px}
.btn:disabled{opacity:.5;pointer-events:none}
.card{background:#fff;border:1px solid rgb(216 193 174/.5);border-radius:28px;box-shadow:var(--shadow);padding:26px}
.grid{display:grid;gap:22px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
input,select{width:100%;height:44px;border:1px solid var(--champagne);border-radius:14px;background:#fff;padding:0 14px;font-size:14px}
input:focus,select:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 4px rgb(216 193 174/.4)}
label.l{display:block;font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--cocoa-s);margin-bottom:6px}
.field{margin-bottom:16px}
.alert{border-radius:12px;padding:12px 16px;font-size:13px;margin-bottom:16px}
.alert.err{background:#fff1f2;color:#9f1239}.alert.ok{background:#ecfdf5;color:#065f46}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 12px;font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;background:rgb(216 193 174/.4)}
.badge.warn{background:#fffbeb;color:#92400e}.badge.okb{background:#ecfdf5;color:#065f46}.badge.line{background:transparent;border:1px solid var(--champagne);color:var(--cocoa-s)}
.bar{height:8px;background:var(--ivory);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--champagne),var(--rose));border-radius:99px;transition:width .8s}
/* header */
header.site{position:sticky;top:0;z-index:20;background:rgb(250 246 241/.85);backdrop-filter:blur(12px);border-bottom:1px solid rgb(216 193 174/.4)}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{display:inline-flex;flex-direction:column;align-items:center;line-height:1;cursor:pointer}
.logo b{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:26px;letter-spacing:.32em}
.logo span{font-size:8.5px;letter-spacing:.5em;color:var(--rose);margin-top:4px;font-weight:500}
nav.top a{font-size:13px;margin-left:24px}nav.top a:hover{color:var(--rose-d)}
/* hero */
.hero{padding:60px 0 80px;background:radial-gradient(ellipse at top right,#fff,transparent 55%),radial-gradient(ellipse at bottom left,#EDE3DA,transparent 60%)}
.hero .wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(54px,8vw,96px)}
.float{animation:float 7s ease-in-out infinite}@keyframes float{50%{transform:translateY(-12px)}}
.scanline{position:absolute;left:18%;right:18%;height:2px;background:linear-gradient(90deg,transparent,var(--rose),transparent);box-shadow:0 0 20px var(--rose);animation:scan 2.4s ease-in-out infinite}
@keyframes scan{0%{top:8%;opacity:0}15%,85%{opacity:1}100%{top:90%;opacity:0}}
section.s{padding:80px 0}
.center{text-align:center}.h2{font-size:clamp(38px,5vw,54px)}
.dark{background:var(--cocoa);color:var(--cream)}
.ivory{background:var(--ivory)}
.icon{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--champagne),var(--rose));color:#fff;font-size:20px}
footer{border-top:1px solid rgb(216 193 174/.5);background:var(--ivory);padding:40px 0;margin-top:60px;font-size:12px;color:var(--cocoa-s);text-align:center}
/* dashboard */
.dash{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside.side{background:var(--ivory);padding:30px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
aside.side a.nav{display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:16px;font-size:14px;color:var(--cocoa-s);cursor:pointer;margin-bottom:2px}
aside.side a.nav:hover{background:rgb(255 255 255/.6);color:var(--cocoa)}
aside.side a.nav.on{background:#fff;color:var(--cocoa);box-shadow:var(--shadow)}
aside.side a.nav .lock{margin-left:auto;opacity:.5;font-size:12px}
main.m{padding:40px 44px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:30px}
.ph h1{font-size:clamp(36px,4vw,50px)}
.mobilebar{display:none}
.list>li{list-style:none;display:flex;align-items:center;gap:14px;padding:12px 6px;border-bottom:1px solid var(--ivory)}
.chk{width:28px;height:28px;border-radius:50%;border:1px solid var(--champagne);background:#fff;cursor:pointer;display:grid;place-items:center;flex-shrink:0;color:#fff}
.chk.on{background:var(--rose);border-color:var(--rose)}
.drop{border:2px dashed var(--champagne);border-radius:24px;aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgb(250 246 241/.6);cursor:pointer;text-align:center;padding:20px}
.drop:hover{background:var(--ivory)}
.stage{position:relative;aspect-ratio:4/3;border-radius:24px;overflow:hidden;background:var(--cocoa)}
.stage video,.stage img{width:100%;height:100%;object-fit:cover;display:block}
.guide{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.guide i{border:2px dashed rgb(216 193 174/.85);box-shadow:0 0 0 9999px rgb(73 53 43/.35)}
.tabs{display:inline-flex;background:var(--ivory);border-radius:999px;padding:4px;margin-bottom:18px}
.tabs button{border:0;background:transparent;padding:8px 20px;border-radius:999px;cursor:pointer;font-size:14px;color:var(--cocoa-s)}
.tabs button.on{background:#fff;color:var(--cocoa);box-shadow:var(--shadow)}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--cream);border:1px solid var(--champagne);padding:12px 20px;border-radius:14px;box-shadow:var(--lux);font-size:14px;z-index:99;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translate(-50%,-8px)}}
.reco{border:1px solid rgb(216 193 174/.6);border-radius:18px;padding:18px;margin-bottom:12px}
.notice{background:linear-gradient(90deg,rgb(216 193 174/.4),var(--ivory));border-radius:16px;padding:14px 18px;font-size:14px;margin-bottom:22px}
@media (max-width:900px){
 .hero .wrap{grid-template-columns:1fr}nav.top{display:none}
 .dash{grid-template-columns:1fr}aside.side{position:fixed;inset:0 auto 0 0;width:270px;z-index:40;transform:translateX(-100%);transition:.4s}
 aside.side.open{transform:none;box-shadow:var(--lux)}
 .mobilebar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgb(216 193 174/.4);position:sticky;top:0;background:rgb(250 246 241/.92);z-index:30}
 main.m{padding:26px 16px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   ÉLORIA SKIN • HAIR — standalone demo (single HTML file).
   Data is stored only in this browser (localStorage).
   The analysis engine is the same one used by the full app.
   ============================================================ */
const KEY = "eloria-demo-v1";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (n, a = 0, b = 100) => Math.min(b, Math.max(a, n));
const lvl = (n) => Math.round(clamp(n));
const avg = (xs) => xs.reduce((a, b) => a + b, 0) / xs.length;
const fmtDate = (d, time) => new Intl.DateTimeFormat("es-ES", time ? { dateStyle: "medium", timeStyle: "short" } : { dateStyle: "medium" }).format(new Date(d));
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);

/* ---------------- storage ---------------- */
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || { users: {}, claimed: {}, session: null }; } catch { return { users: {}, claimed: {}, session: null }; } }
let db = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast("El almacenamiento del navegador está lleno. Borra algún análisis."); } }
const me = () => (db.session ? db.users[db.session] : null);
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); }

/* ---------------- engine (ported from src/lib/analysis/engine.ts) ---------------- */
function extractFeatures(data, w, h) {
  const n = w * h, lum = new Float32Array(n);
  let sumL = 0, sumSat = 0, skin = 0, redSum = 0, hi = 0, dark = 0;
  for (let i = 0; i < n; i++) {
    const o = i * 4, R = data[o], G = data[o + 1], B = data[o + 2], r = R / 255, g = G / 255, b = B / 255;
    const l = 0.2126 * r + 0.7152 * g + 0.0722 * b; lum[i] = l; sumL += l;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), sat = mx === 0 ? 0 : (mx - mn) / mx; sumSat += sat;
    const cb = 128 - 0.168736 * R - 0.331264 * G + 0.5 * B, cr = 128 + 0.5 * R - 0.418688 * G - 0.081312 * B;
    if (cb >= 77 && cb <= 127 && cr >= 133 && cr <= 173) { skin++; redSum += Math.max(0, r - (g + b) / 2); }
    if (l > 0.82 && sat < 0.18) hi++;
    if (l < 0.12) dark++;
  }
  const meanL = sumL / n; let v = 0; for (let i = 0; i < n; i++) v += (lum[i] - meanL) ** 2;
  let lap = 0, spots = 0, c = 0;
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) { const i = y * w + x, nb = (lum[i - 1] + lum[i + 1] + lum[i - w] + lum[i + w]) / 4; lap += Math.abs(lum[i] - nb); if (nb - lum[i] > 0.06) spots++; c++; }
  return { brightness: meanL, contrast: Math.sqrt(v / n), texture: lap / c, redness: skin ? redSum / skin : 0, highlights: hi / n, darkSpots: spots / c, saturation: sumSat / n, skinRatio: skin / n, darkRatio: dark / n };
}
function checkQuality(f, kind) {
  if (f.brightness < 0.08) return "La imagen está demasiado oscura. Enciende la luz del espejo o busca un lugar más iluminado.";
  if (f.brightness > 0.95) return "La imagen está sobreexpuesta. Aléjate un poco de la fuente de luz.";
  if (f.contrast < 0.015 && f.texture < 0.002) return "La imagen no tiene suficiente detalle. Mantente quieta y limpia la lente.";
  if (kind === "skin" && f.skinRatio < 0.08) return "No hemos detectado tu rostro. Céntralo en el encuadre.";
  return null;
}
function skinMetrics(f) {
  const t = Math.min(f.texture / 0.06, 1), sh = Math.min(f.highlights / 0.12, 1), rd = Math.min(f.redness / 0.22, 1), sp = Math.min(f.darkSpots / 0.08, 1), ct = Math.min(f.contrast / 0.3, 1);
  const oiliness = lvl(18 + sh * 70 + (f.saturation > 0.45 ? 6 : 0)), hydration = lvl(82 - t * 35 - (1 - sh) * 10 + (f.brightness - 0.5) * 20);
  const pores = lvl(15 + t * 55 + sh * 15), wrinkles = lvl(10 + t * 45 + ct * 20), redness = lvl(8 + rd * 85), pigmentation = lvl(10 + sp * 60 + ct * 18);
  const elasticity = lvl(88 - wrinkles * 0.45 - (100 - hydration) * 0.2);
  return { hydration, oiliness, pores, wrinkles, redness, pigmentation, elasticity };
}
function scalpMetrics(f) {
  const fl = Math.min(f.highlights / 0.1, 1), rd = Math.min(f.redness / 0.2, 1), hair = Math.min(f.darkRatio / 0.35, 1), t = Math.min(f.texture / 0.08, 1), sh = Math.min(Math.max(f.saturation - 0.15, 0) / 0.4, 1);
  const flaking = lvl(6 + fl * 80), oiliness = lvl(15 + sh * 55 + (1 - fl) * 10), hydration = lvl(78 - fl * 35 - t * 12 + sh * 8);
  const sensitivity = lvl(8 + rd * 80), density = lvl(35 + hair * 55 + t * 8);
  const follicle_health = lvl(90 - flaking * 0.3 - sensitivity * 0.3 - Math.abs(oiliness - 35) * 0.3);
  return { hydration, oiliness, flaking, sensitivity, density, follicle_health };
}
const HEALTH = {
  skin: (m) => ({ hydration: m.hydration, oiliness: lvl(100 - Math.abs(m.oiliness - 40) * 1.6), pores: 100 - m.pores, wrinkles: 100 - m.wrinkles, redness: 100 - m.redness, pigmentation: 100 - m.pigmentation, elasticity: m.elasticity }),
  scalp: (m) => ({ hydration: m.hydration, oiliness: lvl(100 - Math.abs(m.oiliness - 35) * 1.6), flaking: 100 - m.flaking, sensitivity: 100 - m.sensitivity, density: m.density, follicle_health: m.follicle_health }),
};
const LABELS = {
  skin: { hydration: "Hidratación", oiliness: "Equilibrio graso", pores: "Poros", wrinkles: "Líneas finas", redness: "Rojeces", pigmentation: "Tono uniforme", elasticity: "Elasticidad" },
  scalp: { hydration: "Hidratación", oiliness: "Equilibrio graso", flaking: "Descamación", sensitivity: "Sensibilidad", density: "Densidad", follicle_health: "Vitalidad folicular" },
};
const overall = (kind, m) => lvl(avg(Object.values(HEALTH[kind](m))));
function skinType(m) { if (m.redness >= 60) return "sensible"; if (m.oiliness >= 62 && m.hydration < 45) return "mixta"; if (m.oiliness >= 62) return "grasa"; if (m.hydration < 45) return "seca"; return "normal"; }
function scalpType(m) { if (m.sensitivity >= 60) return "sensible"; if (m.flaking >= 55) return "con descamación"; if (m.oiliness >= 60) return "graso"; if (m.hydration < 45) return "seco"; return "equilibrado"; }
const scoreLabel = (s) => (s >= 80 ? "Excelente" : s >= 65 ? "Bueno" : s >= 50 ? "Aceptable" : "Necesita cuidado");
function describe(kind, m, type, score) {
  const o = [];
  if (kind === "skin") {
    o.push(m.hydration < 50 ? "Tu piel muestra signos de deshidratación, sobre todo en las mejillas." : "Los niveles de hidratación se ven sanos y equilibrados.");
    if (m.oiliness > 60) o.push("El brillo visible indica un exceso de sebo en la zona T.");
    if (m.pores > 55) o.push("Los poros se ven dilatados alrededor de la nariz.");
    if (m.wrinkles > 45) o.push("Se aprecian líneas finas alrededor de los ojos y la frente.");
    if (m.redness > 45) o.push("Algunas zonas enrojecidas sugieren irritación o sensibilidad.");
    if (m.pigmentation > 50) o.push("Se observan manchas y un tono irregular.");
    if (m.elasticity > 70) o.push("La firmeza y la elasticidad de tu piel son excelentes.");
    return { summary: `Tu piel se lee como ${type}, con una puntuación de ${score}/100.`, observations: o };
  }
  if (m.oiliness > 60) o.push("El nivel de sebo es elevado a lo largo de la raya.");
  if (m.hydration < 50) o.push("El cuero cabelludo se ve seco y puede sentirse tirante.");
  if (m.flaking > 45) o.push("Se detectan escamas visibles cerca de los folículos.");
  if (m.sensitivity > 45) o.push("Las rojeces sugieren sensibilidad o irritación.");
  if (m.density < 50) o.push("La densidad capilar parece menor en la zona analizada.");
  if (m.follicle_health > 70) o.push("Los folículos se ven limpios y sanos.");
  if (!o.length) o.push("Tu cuero cabelludo se ve equilibrado y cómodo.");
  return { summary: `Tu cuero cabelludo se lee como ${type}, con una puntuación de ${score}/100.`, observations: o };
}
function recommendations(kind, m) {
  const r = [];
  const add = (cond, p, title, body, cat, prod) => cond && r.push({ priority: p, title, body, category: cat, product: prod });
  if (kind === "skin") {
    add(m.hydration < 55, m.hydration < 40 ? 1 : 2, "Restaura la hidratación profunda", "Aplica un sérum de ácido hialurónico sobre la piel húmeda mañana y noche, y sella con crema hidratante.", "Hidratación", "Hydra Veil Serum · 68 €");
    add(m.oiliness > 60, m.oiliness > 75 ? 1 : 2, "Equilibra el exceso de sebo", "Limpia dos veces al día con un gel de pH bajo con niacinamida. Evita cremas oclusivas en la zona T.", "Control del brillo", "Balance Gel Cleanser · 32 €");
    add(m.pores > 55, 2, "Afina la apariencia de los poros", "La niacinamida y una exfoliación suave semanal mantienen los poros limpios.", "Textura", "Balance Gel Cleanser · 32 €");
    add(m.redness > 45, m.redness > 60 ? 1 : 2, "Calma y protege tu barrera", "Elige fórmulas sin perfume y una crema con ceramidas y centella asiática.", "Sensibilidad", "Calm Cica Cream · 54 €");
    add(m.pigmentation > 50, 2, "Unifica tu tono", "Usa vitamina C estabilizada cada mañana y nunca olvides el SPF.", "Luminosidad", "Lumière C Serum · 74 €");
    add(m.wrinkles > 45 || m.elasticity < 55, 2, "Suaviza las líneas finas por la noche", "Introduce un tratamiento con retinal 2–3 noches por semana.", "Antiedad", "Renew Retinal Night · 82 €");
    r.push({ priority: 3, title: "Protección solar diaria", body: "SPF 50 de amplio espectro cada mañana es el paso más eficaz del cuidado de la piel.", category: "Protección", product: "Solaire SPF 50 · 39 €" });
  } else {
    add(m.oiliness > 60, m.oiliness > 75 ? 1 : 2, "Reequilibra un cuero cabelludo graso", "Lava cada 1–2 días con un champú clarificante sin sulfatos, masajeando el cuero cabelludo.", "Control del sebo", "Scalp Purify Shampoo · 34 €");
    add(m.hydration < 55, m.hydration < 40 ? 1 : 2, "Alivia la sequedad", "Aplica un elixir hidratante sin aclarado después del lavado y evita el agua muy caliente.", "Hidratación", "Scalp Hydra Elixir · 46 €");
    add(m.flaking > 45, m.flaking > 60 ? 1 : 2, "Elimina escamas y residuos", "Usa un exfoliante para el cuero cabelludo una vez por semana.", "Descamación", "Clarifying Scalp Scrub · 38 €");
    add(m.sensitivity > 45, m.sensitivity > 60 ? 1 : 2, "Calma la sensibilidad", "Cambia a fórmulas sin perfume y aplica un tónico calmante sin alcohol.", "Sensibilidad", "Soothing Scalp Tonic · 36 €");
    add(m.density < 55 || m.follicle_health < 60, 2, "Estimula la vitalidad folicular", "Un sérum nocturno con cafeína y romero y dos minutos de masaje estimulan la circulación.", "Densidad", "Follicle Vital Serum · 59 €");
    r.push({ priority: 3, title: "Pasa el peine cada día", body: "Una sesión diaria con el Smart Comb distribuye los aceites naturales y sigue tu evolución.", category: "Hábito", product: null });
  }
  return r.sort((a, b) => a.priority - b.priority);
}
function routine(kind, m) {
  const s = (t, title, desc) => ({ id: uid(), kind, time: t, title, desc });
  if (kind === "skin") return [
    s("morning", "Limpieza", m.oiliness > 55 ? "Gel limpiador, 60 segundos" : "Agua tibia o leche limpiadora"),
    s("morning", m.pigmentation > 50 ? "Sérum de vitamina C" : "Sérum hidratante", "3–4 gotas"),
    s("morning", "Hidratante", m.redness > 45 ? "Crema barrera con centella" : "Hidratante ligera"),
    s("morning", "SPF 50", "Rostro y cuello"),
    s("evening", "Doble limpieza", "Retira SPF y maquillaje"),
    s("evening", "Sérum hidratante", "Sobre la piel húmeda"),
    ...(m.wrinkles > 45 || m.elasticity < 55 ? [s("evening", "Tratamiento con retinal", "2–3 noches por semana")] : []),
    s("evening", "Crema de noche", "Sella la hidratación"),
    s("weekly", "Escaneo con el Smart Mirror", "Con la misma luz cada semana"),
  ];
  return [
    s("morning", "Sesión con el Smart Comb", "Dos minutos, de raíz a puntas"),
    ...(m.hydration < 55 ? [s("morning", "Hydra Elixir", "Unas gotas en la raya")] : []),
    ...(m.sensitivity > 45 ? [s("morning", "Tónico calmante", "Pulverizar y dar toques")] : []),
    s("evening", "Masaje del cuero cabelludo", "Dos minutos con las yemas"),
    s("weekly", m.oiliness > 60 ? "Lavado clarificante" : "Lavado suave", m.oiliness > 60 ? "Cada 1–2 días" : "2–3 veces por semana"),
    ...(m.flaking > 45 ? [s("weekly", "Exfoliante capilar", "Una vez por semana")] : []),
    s("weekly", "Escaneo con el Smart Comb", "Control semanal"),
  ];
}

/* ---------------- devices ---------------- */

function ring(score, size = 150) {
  const st = size * 0.07, r = (size - st) / 2, c = 2 * Math.PI * r, off = c - (score / 100) * c;
  return `<div style="position:relative;width:${size}px;height:${size}px;display:inline-grid;place-items:center">
  <svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><defs><linearGradient id="rg${size}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D8C1AE"/><stop offset="1" stop-color="#9C7E68"/></linearGradient></defs>
  <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#F5EEE8" stroke-width="${st}"/>
  <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="url(#rg${size})" stroke-width="${st}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>
  <div style="position:absolute;text-align:center"><div class="serif" style="font-size:${size * 0.3}px;line-height:1">${score}</div><div class="xs muted" style="letter-spacing:.2em;text-transform:uppercase;margin-top:4px">${scoreLabel(score)}</div></div></div>`;
}
function lineChart(points) {
  if (points.length < 2) return `<div class="center muted small" style="border:1px dashed var(--champagne);border-radius:18px;padding:60px 20px">Tu curva de progreso aparecerá tras tu segundo análisis.</div>`;
  const W = 640, H = 220, p = 30, xs = (i) => p + (i * (W - 2 * p)) / (points.length - 1), ys = (v) => H - p - (v / 100) * (H - 2 * p);
  const d = points.map((pt, i) => `${i ? "L" : "M"}${xs(i)},${ys(pt.v)}`).join("");
  const area = `${d}L${xs(points.length - 1)},${H - p}L${xs(0)},${H - p}Z`;
  const grid = [0, 25, 50, 75, 100].map((g) => `<line x1="${p}" x2="${W - p}" y1="${ys(g)}" y2="${ys(g)}" stroke="#F5EEE8"/><text x="4" y="${ys(g) + 4}" font-size="10" fill="#6F584B">${g}</text>`).join("");
  const dots = points.map((pt, i) => `<circle cx="${xs(i)}" cy="${ys(pt.v)}" r="4" fill="#9C7E68"><title>${pt.l}: ${pt.v}</title></circle>`).join("");
  const labels = points.map((pt, i) => (i === 0 || i === points.length - 1 || points.length <= 6 ? `<text x="${xs(i)}" y="${H - 8}" font-size="10" fill="#6F584B" text-anchor="middle">${pt.l}</text>` : "")).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B99A83" stop-opacity=".45"/><stop offset="1" stop-color="#B99A83" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#ar)"/><path d="${d}" fill="none" stroke="#9C7E68" stroke-width="2.5"/>${dots}${labels}</svg>`;
}
function radar(kind, h, prev) {
  const keys = Object.keys(LABELS[kind]), N = keys.length, S = 320, c = S / 2, R = 105;
  const pt = (i, v) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / N; return [c + Math.cos(a) * R * v / 100, c + Math.sin(a) * R * v / 100]; };
  const poly = (vals) => vals.map((v, i) => pt(i, v).join(",")).join(" ");
  const rings = [25, 50, 75, 100].map((g) => `<polygon points="${poly(keys.map(() => g))}" fill="none" stroke="#EDE3DA"/>`).join("");
  const labels = keys.map((k, i) => { const [x, y] = pt(i, 128); return `<text x="${x}" y="${y}" font-size="10.5" fill="#6F584B" text-anchor="middle" dominant-baseline="middle">${LABELS[kind][k]}</text>`; }).join("");
  return `<svg viewBox="-30 0 380 ${S}" style="width:100%;max-width:420px;display:block;margin:auto">${rings}
  ${prev ? `<polygon points="${poly(keys.map((k) => prev[k]))}" fill="#D8C1AE" fill-opacity=".15" stroke="#D8C1AE" stroke-dasharray="4 4"/>` : ""}
  <polygon points="${poly(keys.map((k) => h[k]))}" fill="#B99A83" fill-opacity=".35" stroke="#9C7E68" stroke-width="2"/>${labels}</svg>`;
}
function bars(kind, h, prev) {
  return Object.keys(LABELS[kind]).map((k) => {

    return `<div style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px"><span>${LABELS[kind][k]}</span><span>${d ? `<span class="xs" style="color:${d > 0 ? "#047857" : "#be123c"}">${d > 0 ? "▲" : "▼"} ${Math.abs(d)}</span> ` : ""}<span class="serif" style="font-size:18px">${h[k]}</span></span></div><div class="bar"><i style="width:${h[k]}%"></i></div></div>`;
  }).join("");
}

  const u = me();
  if (!owns(u, KIND[kind].device)) return shell(kind, ph(KIND[kind].name, `Nuevo análisis`) + locked(kind));
  return shell(kind, ph(KIND[kind].name, kind === "skin" ? "Nuevo análisis de piel" : "Nuevo análisis capilar", kind === "skin" ? "Centra tu rostro con luz suave y uniforme. Quítate las gafas y recógete el pelo." : "Separa el cabello y acerca la lente al cuero cabelludo, en la coronilla o las sienes.") +
  `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start"><div class="card" id="scanbox">
  <div class="tabs"><button class="on" id="tUp" onclick="scanTab('up')">Subir foto</button><button id="tCam" onclick="scanTab('cam')">Cámara</button></div>
  <div id="pUp"><label class="drop" id="drop"><div style="font-size:36px;color:var(--rose)">⇪</div><p class="serif" style="font-size:24px;margin-top:8px">Arrastra una foto o elige un archivo</p><p class="xs muted">JPEG, PNG o WebP · hasta 8 MB</p><input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden></label></div>
  <div id="pCam" hidden><div class="stage"><video id="vid" playsinline muted style="${kind === "skin" ? "transform:scaleX(-1)" : ""}"></video><div class="guide"><i style="${kind === "skin" ? "width:46%;height:78%;border-radius:50%" : "width:60%;aspect-ratio:1;border-radius:50%"}"></i></div></div>
  <div style="display:flex;justify-content:center;gap:10px;margin-top:16px"><button class="btn" onclick="capture('${kind}')">Capturar</button></div><p id="camerr" class="small muted center" style="margin-top:10px"></p></div>
  ${err ? `<div class="alert err" style="margin-top:16px">${esc(err)}</div>` : ""}</div>
  <div class="card" style="background:var(--ivory);box-shadow:none;border:0"><p class="serif" style="font-size:24px">Para mejores resultados</p><ul style="margin-top:12px;padding-left:18px" class="small muted">
  ${(kind === "skin" ? ["Limpia tu rostro y retira el maquillaje.", "Luz suave y frontal, sin contraluz.", "Mira de frente con expresión neutra.", "Escanea a la misma hora cada semana."] : ["Cabello seco y sin productos.", "Separa el pelo en la coronilla o las sienes.", "Acerca la lente al cuero cabelludo.", "Escanea la misma zona cada semana."]).map((t) => `<li style="margin-bottom:6px">${t}</li>`).join("")}</ul>
  <p class="xs muted" style="margin-top:16px">Tu imagen se analiza en tu dispositivo y se guarda solo en este navegador.</p></div></div>`);
}
function vKind(kind) {
  const u = me(), k = KIND[kind];
  if (!owns(u, k.device)) return shell(kind, ph(k.name, k.title) + locked(kind));
  const list = u[kind], last = list[list.length - 1], prev = list[list.length - 2];
  const act = `<a class="btn goldb" href="#/scan/${kind}">＋ Nuevo escaneo</a>`;
  if (!last) return shell(kind, ph(k.name, k.title, "", act) + `<div class="card center" style="padding:50px"><p class="serif" style="font-size:30px">Tu primer análisis te espera.</p><a class="btn" style="margin-top:20px" href="#/scan/${kind}">Empezar análisis</a></div>`);
  const h = HEALTH[kind](last.metrics), ph2 = prev ? HEALTH[kind](prev.metrics) : null;
  return shell(kind, ph(k.name, k.title, `${list.length} análisis registrados`, act) + `<div class="grid g2">
  <div class="card"><p class="eyebrow">Último · ${fmtDate(last.date)}</p><h3 style="font-size:28px;margin:6px 0 18px">${scoreLabel(last.score)}</h3><div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap">${ring(last.score, 160)}<div style="flex:1;min-width:200px"><span class="badge">${esc(last.type)}</span><p class="small muted" style="margin:10px 0">${esc(last.summary)}</p><a href="#/report/${kind}/${last.id}" class="small" style="color:var(--rose-d)">Ver informe completo →</a></div></div></div>
  <div class="card"><h3 style="font-size:28px">Perfil</h3>${radar(kind, h, ph2)}</div></div>
  <div class="grid g2" style="margin-top:22px"><div class="card"><h3 style="font-size:28px;margin-bottom:14px">Puntuación global</h3>${lineChart(list.map((a) => ({ v: a.score, l: new Date(a.date).toLocaleDateString("es-ES", { day: "numeric", month: "short" }) })))}</div>
  <div class="card"><h3 style="font-size:28px;margin-bottom:14px">Salud por métrica</h3>${bars(kind, h, ph2)}</div></div>
  <div class="card" style="margin-top:22px"><h3 style="font-size:28px;margin-bottom:10px">Historial</h3><ul class="list">${[...list].reverse().map((a) => `<li><a href="#/report/${kind}/${a.id}" style="display:flex;align-items:center;gap:14px;width:100%"><span class="serif" style="width:44px;height:44px;border-radius:50%;background:var(--ivory);display:grid;place-items:center;font-size:18px">${a.score}</span><span style="flex:1"><span class="small">${fmtDate(a.date, true)}</span><br><span class="xs muted">${esc(a.type)}</span></span>→</a></li>`).join("")}</ul></div>`);
}
function vReport(kind, id, isNew) {
  const u = me(), list = u[kind], i = list.findIndex((a) => a.id === id);
  if (i < 0) { location.hash = `#/${kind}`; return ""; }
  const a = list[i], prev = list[i - 1], h = HEALTH[kind](a.metrics), ph2 = prev ? HEALTH[kind](prev.metrics) : null, d = prev ? a.score - prev.score : null;
  return shell(kind, `<a href="#/${kind}" class="small muted">← ${KIND[kind].title}</a>${isNew ? `<div class="notice" style="margin-top:18px">✦ Análisis completado. Tu ritual se ha actualizado con los resultados de hoy.</div>` : ""}` +
  ph(fmtDate(a.date, true), kind === "skin" ? "Informe de piel" : "Informe capilar", "", `<div style="display:flex;gap:10px"><a class="btn out" href="#/scan/${kind}">Escanear de nuevo</a><button class="btn ghost" onclick="delAnalysis('${kind}','${a.id}')">Eliminar</button></div>`) +
  `<div class="grid g2"><div class="card" style="padding:0;overflow:hidden">${a.image ? `<img src="${a.image}" alt="" style="width:100%;aspect-ratio:4/3;object-fit:cover;display:block">` : ""}<div style="padding:24px;display:flex;gap:22px;align-items:center;flex-wrap:wrap">${ring(a.score, 130)}<div><p class="serif" style="font-size:26px">${scoreLabel(a.score)}</p>${d !== null ? `<p class="small" style="color:${d >= 0 ? "#047857" : "#be123c"}">${d >= 0 ? "+" : ""}${d} vs. escaneo anterior</p>` : ""}<span class="badge" style="margin-top:6px">${esc(a.type)}</span> <span class="badge line">Motor de visión</span></div></div></div>
  <div class="card"><h3 style="font-size:28px">Lo que vemos</h3><p class="serif" style="font-size:21px;margin:12px 0">${esc(a.summary)}</p><ul style="padding-left:18px" class="small muted">${a.observations.map((o) => `<li style="margin-bottom:6px">${esc(o)}</li>`).join("")}</ul>${radar(kind, h, ph2)}</div></div>
  <div class="grid g2" style="margin-top:22px"><div class="card"><h3 style="font-size:28px">Métricas</h3><p class="xs muted" style="margin-bottom:16px">Puntuaciones de salud sobre 100: cuanto más alto, mejor.</p>${bars(kind, h, ph2)}</div>
  <div class="card"><h3 style="font-size:28px;margin-bottom:16px">Tus recomendaciones</h3>${a.recos.map((r) => `<div class="reco"><span class="badge ${r.priority === 1 ? "warn" : r.priority === 3 ? "line" : ""}">${r.priority === 1 ? "Prioridad" : esc(r.category)}</span><p class="serif" style="font-size:21px;margin-top:10px">${esc(r.title)}</p><p class="small muted" style="margin-top:4px">${esc(r.body)}</p>${r.product ? `<p class="small" style="margin-top:10px;background:rgb(245 238 232/.7);padding:10px 14px;border-radius:12px">${esc(r.product)}</p>` : ""}</div>`).join("")}</div></div>`);
}
function vRoutine() {
  const u = me(), t = today(), doneToday = u.done[t] || [];
  if (!u.routine.length) return shell("routine", ph("Ritual diario", "Mi ritual") + `<div class="card center" style="padding:50px"><p class="serif" style="font-size:26px">Todavía no tienes ritual</p><p class="small muted">Haz un análisis y ÉLORIA compondrá tu ritual personalizado.</p></div>`);
  const groups = [["morning", "☀ Mañana"], ["evening", "☾ Noche"], ["weekly", "▦ Esta semana"]];
  let streak = 0; const daily = u.routine.filter((s) => s.time !== "weekly");
  for (let i = 0; i < 60; i++) { const d = new Date(); d.setDate(d.getDate() - i); const ds = new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); const c = daily.filter((s) => u.done[ds]?.includes(s.id)).length; if (daily.length && c / daily.length >= 0.5) streak++; else if (i > 0) break; }
  return shell("routine", ph("Ritual diario", "Mi ritual", "Compuesto a partir de tus últimos análisis. Se actualiza cada vez que escaneas.") + `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start"><div>
  ${groups.map(([g, l]) => { const s = u.routine.filter((x) => x.time === g); return s.length ? `<div class="card" style="margin-bottom:18px"><h2 style="font-size:28px">${l}</h2><ul class="list" style="margin-top:8px">${s.map((x) => { const on = doneToday.includes(x.id); return `<li><button class="chk ${on ? "on" : ""}" onclick="toggleStep('${x.id}')" aria-label="Marcar ${esc(x.title)}">${on ? "✓" : ""}</button><span style="flex:1"><span class="small" style="${on ? "text-decoration:line-through;color:var(--cocoa-s)" : ""}">${esc(x.title)}</span><br><span class="xs muted">${esc(x.desc)}</span></span><span class="badge line">${x.kind === "skin" ? "piel" : "capilar"}</span></li>`; }).join("")}</ul></div>` : ""; }).join("")}</div>
  <div class="card" style="background:var(--cocoa);color:var(--cream);border:0"><p class="xs" style="letter-spacing:.2em;text-transform:uppercase;color:var(--champagne)">Racha</p><p class="serif" style="font-size:64px">${streak} <span style="font-size:22px;opacity:.7">día${streak === 1 ? "" : "s"}</span></p><p class="xs" style="opacity:.6">Días con al menos la mitad de tu ritual completado.</p></div></div>`);
}

/* ---------------- actions ---------------- */
function logout() { db.session = null; save(); stopCam(); location.hash = "#/"; }
function unpair(serial) { if (!confirm("¿Quitar este dispositivo? Tu historial se conserva.")) return; const u = me(); u.devices = u.devices.filter((d) => d.serial !== serial); delete db.claimed[serial]; save(); toast("Dispositivo quitado"); render(); }
function delAnalysis(kind, id) { if (!confirm("¿Eliminar este análisis de forma permanente?")) return; const u = me(); u[kind] = u[kind].filter((a) => a.id !== id); save(); toast("Análisis eliminado"); location.hash = `#/${kind}`; }
function toggleStep(id) { const u = me(), t = today(); u.done[t] = u.done[t] || []; u.done[t] = u.done[t].includes(id) ? u.done[t].filter((x) => x !== id) : [...u.done[t], id]; save(); render(); }
function scanTab(t) {
  $("#tUp").classList.toggle("on", t === "up"); $("#tCam").classList.toggle("on", t === "cam"); $("#pUp").hidden = t !== "up"; $("#pCam").hidden = t !== "cam";
  if (t === "cam") startCam(); else stopCam();
}
async function startCam() {
  const kind = location.hash.split("/")[2];
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: kind === "skin" ? "user" : "environment" }, audio: false }); const v = $("#vid"); v.srcObject = stream; await v.play(); }
  catch { $("#camerr").textContent = "No hemos podido acceder a la cámara. Permite el acceso o sube una foto."; }
}
function capture(kind) {
  const v = $("#vid"); if (!v || !v.videoWidth) return;
  const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight; const x = c.getContext("2d");
  if (kind === "skin") { x.translate(c.width, 0); x.scale(-1, 1); }
  x.drawImage(v, 0, 0); stopCam(); analyze(kind, c.toDataURL("image/jpeg", 0.92));
}
function analyze(kind, src) {
  const box = $("#scanbox");
  box.innerHTML = `<div class="center" style="padding:20px"><div style="position:relative;width:220px;aspect-ratio:1;margin:auto;border-radius:50%;overflow:hidden;border:4px solid var(--champagne)"><img src="${src}" style="width:100%;height:100%;object-fit:cover;opacity:.8"><div class="scanline" style="left:0;right:0"></div></div><p class="serif" id="stg" style="font-size:24px;margin-top:24px">✦ Calibrando la luz…</p><div class="bar" style="margin-top:16px"><i id="pg" style="width:15%"></i></div></div>`;
  const stages = ["Calibrando la luz", "Mapeando la textura", "Midiendo tono y equilibrio", "Componiendo tu ritual"];
  stages.forEach((s, i) => setTimeout(() => { const e = $("#stg"), p = $("#pg"); if (e) e.textContent = `✦ ${s}…`; if (p) p.style.width = `${(i + 1) * 25}%`; }, i * 600));
  const img = new Image();
  img.onload = () => setTimeout(() => {
    // features on a 192×192 centre crop (same as the server pipeline)
    const S = 192, c = document.createElement("canvas"); c.width = S; c.height = S; const x = c.getContext("2d", { willReadFrequently: true });
    const sc = Math.max(S / img.width, S / img.height), w = img.width * sc, h = img.height * sc; x.drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
    const f = extractFeatures(x.getImageData(0, 0, S, S).data, S, S);
    const issue = checkQuality(f, kind);
    if (issue) return render(issue);
    // keep a small copy of the photo
    const T = 640, ts = Math.min(1, T / Math.max(img.width, img.height)), t = document.createElement("canvas"); t.width = img.width * ts; t.height = img.height * ts; t.getContext("2d").drawImage(img, 0, 0, t.width, t.height);
    const metrics = kind === "skin" ? skinMetrics(f) : scalpMetrics(f), score = overall(kind, metrics), type = kind === "skin" ? skinType(metrics) : scalpType(metrics), { summary, observations } = describe(kind, metrics, type, score);
    const u = me(), a = { id: uid(), date: new Date().toISOString(), metrics, score, type, summary, observations, recos: recommendations(kind, metrics), image: t.toDataURL("image/jpeg", 0.75) };
    u[kind].push(a); u.routine = [...u.routine.filter((s) => s.kind !== kind), ...routine(kind, metrics)];
    save(); location.hash = `#/report/${kind}/${a.id}/new`;
  }, 2400);
  img.onerror = () => render("Este archivo no se puede leer como imagen.");
  img.src = src;
}

/* ---------------- router ---------------- */
function bind() {
  const af = $("#authf");
  if (af) af.onsubmit = (e) => {
    e.preventDefault();
    const su = location.hash.startsWith("#/signup"), email = $("#e").value.trim().toLowerCase(), pass = $("#p").value;
    if (su) {
      const name = $("#n").value.trim();
      if (name.length < 2) return go(vAuth("signup", "Introduce tu nombre."));
      if (!/[A-Za-z]/.test(pass) || !/\d/.test(pass)) return go(vAuth("signup", "La contraseña debe tener letras y números (mínimo 8)."));
      if (db.users[email]) return go(vAuth("signup", "Ya existe una cuenta con este email."));
      db.users[email] = { name, pass: hash(pass), devices: [], skin: [], scalp: [], routine: [], done: {} };
      db.session = email; save(); location.hash = "#/devices";
    } else {
      const u = db.users[email];
      if (!u || u.pass !== hash(pass)) return go(vAuth("login", "Email o contraseña incorrectos."));
      db.session = email; save(); location.hash = "#/dashboard";
    }
  };
  const pf = $("#pairf");
  if (pf) {
    $("#sn").oninput = (e) => { const s = normSerial(e.target.value); $("#det").textContent = /^ELM-/.test(s) ? "Detectado: ÉLORIA Smart Mirror" : /^ELC-/.test(s) ? "Detectado: ÉLORIA Smart Comb" : ""; };
    pf.onsubmit = (e) => {
      e.preventDefault();
      const s = normSerial($("#sn").value), u = me();
      if (!/^EL[MC]-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(s)) return go(vDevices({ ok: false, text: "Formato: ELM-XXXX-XXXX (espejo) o ELC-XXXX-XXXX (peine)." }));
      if (!SERIAL_RE.test(s)) return go(vDevices({ ok: false, text: "No encontramos este número de serie. En la demo usa ELM-DEMO-0001…0050 o ELC-DEMO-0001…0050." }));
      if (db.claimed[s] && db.claimed[s] !== db.session) return go(vDevices({ ok: false, text: "Este dispositivo ya está registrado en otra cuenta." }));
      if (u.devices.some((d) => d.serial === s)) return go(vDevices({ ok: false, text: "Este dispositivo ya está en tu cuenta." }));
      const type = s.startsWith("ELM") ? "mirror" : "comb";
      u.devices.push({ serial: s, type, nickname: $("#nn").value.trim() || (type === "mirror" ? "Mi Smart Mirror" : "Mi Smart Comb"), paired: new Date().toISOString() });
      db.claimed[s] = db.session; save(); go(vDevices({ ok: true, text: `${type === "mirror" ? "Smart Mirror" : "Smart Comb"} emparejado. ¡Ya puedes hacer tu primer escaneo!` }));
    };
  }
  const file = $("#file"), drop = $("#drop");
  if (file) {
    const kind = location.hash.split("/")[2];
    const handle = (f) => {
      if (!f) return;
      if (!/^image\/(jpeg|png|webp)$/.test(f.type)) return render("Elige una imagen JPEG, PNG o WebP.");
      if (f.size > 8 * 1024 * 1024) return render("Las imágenes deben pesar 8 MB o menos.");
      const r = new FileReader(); r.onload = () => analyze(kind, r.result); r.readAsDataURL(f);
    };
    file.onchange = () => handle(file.files[0]);
    drop.ondragover = (e) => e.preventDefault();
    drop.ondrop = (e) => { e.preventDefault(); handle(e.dataTransfer.files[0]); };
  }
}
function hash(s) { let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return "h" + (h >>> 0).toString(36); }
function go(html) { $("#app").innerHTML = html; bind(); }
function render(err) {
  stopCam();
  const parts = location.hash.replace(/^#\/?/, "").split("/"), [r, a, b, c] = parts;
  const anchor = location.hash.split("#")[2];
  const priv = ["dashboard", "devices", "skin", "scalp", "scan", "report", "routine"];
  if (priv.includes(r) && !me()) { location.hash = "#/login"; return; }
  if (["login", "signup"].includes(r) && me()) { location.hash = "#/dashboard"; return; }
  let html;
  switch (r) {
    case "login": html = vAuth("login"); break;
    case "signup": html = vAuth("signup"); break;
    case "dashboard": html = vDashboard(); break;
    case "devices": html = vDevices(); break;
    case "skin": case "scalp": html = vKind(r); break;
    case "scan": html = vScan(a === "scalp" ? "scalp" : "skin", typeof err === "string" ? err : ""); break;
    case "report": html = vReport(a === "scalp" ? "scalp" : "skin", b, c === "new"); break;
    case "routine": html = vRoutine(); break;
    default: html = vHome();
  }
  if (html) go(html);
  if (anchor) document.getElementById(anchor)?.scrollIntoView({ behavior: "smooth" }); else window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => render());
render();
</script>
